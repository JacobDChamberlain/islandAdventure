# Push to main -> web build -> itch.io.
#
# Before this works, three one-time things:
#   1. Create the game on itch.io and set its Kind to "HTML".
#   2. Repo Settings > Secrets and variables > Actions:
#        secret   BUTLER_API_KEY   from https://itch.io/user/settings/api-keys
#        variable ITCH_USER        your itch username
#        variable ITCH_GAME        the game's URL slug
#   3. On the itch page, tick "SharedArrayBuffer support" under the embed
#      options. The export below is built with thread support, and without
#      that header the game will not boot in the browser.
name: Deploy to itch.io

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:        # lets you trigger a deploy by hand from the Actions tab

env:
  GODOT_VERSION: 4.5.1

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Cache Godot + export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot ${{ env.GODOT_VERSION }} and its web templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fL -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          # Templates must sit in a directory named exactly "<version>.stable".
          curl -fL -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import assets
        # A clean checkout has no .godot/ cache, and exporting without importing
        # first produces a broken build. --import is allowed to report errors on
        # the first pass (resources referencing not-yet-imported ones), hence the
        # `|| true`; the export step below is the real gate.
        run: ~/godot/godot --headless --path . --import || true

      - name: Export web build
        run: |
          set -euo pipefail
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.pck   # fail loudly rather than deploying an empty build
          ls -lh build/web

      - name: Upload build as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 14

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: ${{ vars.ITCH_USER }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        run: |
          set -euo pipefail
          curl -fL -o /tmp/butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q /tmp/butler.zip -d /tmp/butler
          chmod +x /tmp/butler/butler
          /tmp/butler/butler push build/web "$ITCH_USER/$ITCH_GAME:html5" \
            --userversion "${GITHUB_RUN_NUMBER}-$(git rev-parse --short HEAD)"
